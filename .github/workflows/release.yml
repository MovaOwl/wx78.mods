# Публикует релиз одного из модов репозитория. Два способа запуска:
#   * пуш тега: v0.1.0 — wx1102, trickster-v0.1.0 — Trickster (тег <папка>-v<версия>);
#   * вручную: вкладка Actions -> Release -> Run workflow (тег создастся сам).
# Архив содержит только папку мода — её и нужно класть в папку mods игры.
name: Release

on:
  push:
    tags:
      - "v*"
      - "*-v*"
  workflow_dispatch:
    inputs:
      mod:
        description: "Папка мода: wx1102 или trickster"
        required: true
        default: "wx1102"
      version:
        description: "Версия без буквы v, например 0.1.0 (по умолчанию — из modinfo.lua)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the mod, the tag and check modinfo.lua
        env:
          INPUT_MOD: ${{ github.event.inputs.mod }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            case "$TAG" in
              v*) MOD="wx1102" ;;
              *-v*) MOD="${TAG%%-v*}" ;;
            esac
          else
            MOD="$INPUT_MOD"
          fi
          if [ ! -f "$MOD/modinfo.lua" ]; then
            echo "::error::no mod folder '$MOD' with modinfo.lua"
            exit 1
          fi
          MOD_VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' "$MOD/modinfo.lua")
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            VERSION="${INPUT_VERSION#v}"
            [ -z "$VERSION" ] && VERSION="$MOD_VERSION"
            if [ "$MOD" = "wx1102" ]; then TAG="v$VERSION"; else TAG="$MOD-v$VERSION"; fi
          fi
          TAG_VERSION="${TAG##*v}"
          echo "mod: $MOD, modinfo: $MOD_VERSION, tag: $TAG"
          if [ "$MOD_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::version in $MOD/modinfo.lua ($MOD_VERSION) does not match tag ($TAG)"
            exit 1
          fi
          echo "MOD=$MOD" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check Lua syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          find "$MOD" -name "*.lua" -print0 | xargs -0 -n1 luac5.1 -p

      - name: Build archive
        run: zip -r "${MOD}-${TAG##*-}.zip" "$MOD" && ls -la *.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "Релиз ${TAG}" > "$NOTES"
          fi
          NAME="$(grep -oP '^name\s*=\s*"\K[^"]+' "$MOD/modinfo.lua") ${TAG##*-}"
          # --target: если тега ещё нет, GitHub создаст его на этом коммите.
          gh release create "$TAG" "${MOD}-${TAG##*-}.zip" \
            --target "$GITHUB_SHA" \
            --title "$NAME" \
            --notes-file "$NOTES"
